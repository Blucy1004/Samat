name: Samat Studio Windows x64

on: [push, pull_request]

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: >-
          cmake -S . -B build -A x64
          -DJMENGINE_BUILD_ENGINE=ON
          -DJMENGINE_BUILD_SANDBOX=ON
          -DJMENGINE_ENABLE_LLVM=OFF
      - name: Build Studio and regression targets
        run: cmake --build build --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Create portable ZIP
        run: cmake --build build --target package --config Release
      - name: Inspect portable ZIP and run packaged CLI
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/SamatStudio-*-Windows-x64.zip | Select-Object -First 1
          if (-not $archive) { throw 'Windows x64 ZIP was not created.' }
          $expanded = Join-Path $env:RUNNER_TEMP 'SamatStudio-package-check'
          Expand-Archive -Path $archive.FullName -DestinationPath $expanded -Force
          $root = Get-ChildItem $expanded -Directory | Select-Object -First 1
          foreach ($required in @('SamatStudio.exe', 'jmengine_sandbox.exe', 'bin/SamatCompiler.exe', 'examples/Samat/v1.0/hello.st')) {
            if (-not (Test-Path (Join-Path $root.FullName $required))) { throw "ZIP is missing $required" }
          }
          & (Join-Path $root.FullName 'bin/SamatCompiler.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged compiler CLI did not start successfully.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SamatStudio-Windows-x64
          path: build/SamatStudio-*-Windows-x64.zip
          if-no-files-found: error
