name: Samat Studio Windows x64

on: [push, pull_request]

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: >-
          cmake -S . -B build -A x64
          -DJMENGINE_BUILD_ENGINE=ON
          -DJMENGINE_BUILD_SANDBOX=ON
          -DJMENGINE_ENABLE_LLVM=OFF
      - name: Build Studio and regression targets
        run: cmake --build build --config Release --parallel 2
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Create portable ZIP
        run: cmake --build build --target package --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: SamatStudio-Windows-x64
          path: build/SamatStudio-*-Windows-x64.zip
          if-no-files-found: error
