  <text x="95" y="402" fill="#33433a" font-family="'Noto Serif KR', 'Batang', serif" font-size="24">사람의 뜻이 CPU에 사맛게 하노라.</text>
  <text x="97" y="446" fill="#72664d" font-family="'Noto Serif KR', 'Batang', serif" font-size="16" letter-spacing="1">훈민정음의 뜻을 오늘의 언어로 잇다</text>
