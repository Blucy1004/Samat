<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
  <title id="title">Samat — 사람의 뜻이 CPU에 사맛게 하노라</title>
  <desc id="desc">옛 한지의 결 위에 붓글씨로 쓴 사맛과, 같은 바탕에 인쇄된 Samat 코드</desc>
  <defs>
    <linearGradient id="hanji" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5ecd8"/><stop offset=".48" stop-color="#eee2c7"/><stop offset="1" stop-color="#e5d4b3"/></linearGradient>
    <linearGradient id="calligraphy" x1=".08" y1=".08" x2=".88" y2=".94"><stop stop-color="#192c27"/><stop offset=".5" stop-color="#263b32"/><stop offset="1" stop-color="#14241f"/></linearGradient>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="12"/><feColorMatrix values=".8 0 0 0 .7  0 .72 0 0 .61  0 0 .56 0 .45  0 0 0 .11 0"/></filter>
    <filter id="ink-edge" x="-8%" y="-12%" width="116%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="rough"/><feDisplacementMap in="SourceGraphic" in2="rough" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
