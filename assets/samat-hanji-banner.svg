  <text x="796" y="390" fill="#a84c37" font-family="Consolas, 'Cascadia Mono', monospace" font-size="16">04</text><text x="842" y="390" fill="#617750" font-family="Consolas, 'Cascadia Mono', monospace" font-size="17">    return</text><text x="948" y="390" fill="#23372f" font-family="Consolas, 'Cascadia Mono', monospace" font-size="17">42</text>
